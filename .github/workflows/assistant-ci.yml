name: Assistant CI and PR helper
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Ruby
        if: hashFiles('Gemfile') != ''
        uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Set up Python
        if: hashFiles('pyproject.toml', 'pytest.ini', 'requirements.txt') != ''
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run detected checks
        shell: bash
        run: |
          set -euo pipefail
          ran=0
          if [[ -f Cargo.toml ]]; then cargo test --workspace; ran=1; fi
          if [[ -f Gemfile ]]; then if [[ -f Rakefile ]]; then bundle exec rake test; else bundle check; fi; ran=1; fi
          if [[ -f package.json ]]; then
            if [[ -f package-lock.json ]]; then npm ci; elif [[ -f pnpm-lock.yaml ]]; then corepack enable && pnpm install --frozen-lockfile; elif [[ -f yarn.lock ]]; then corepack enable && yarn install --immutable; fi
            node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)" && npm test || echo 'No npm test script; skipping Node test command.'
            ran=1
          fi
          if [[ -f pyproject.toml || -f pytest.ini || -f requirements.txt ]]; then python -m pytest; ran=1; fi
          if [[ -f go.mod ]]; then go test ./...; ran=1; fi
          if [[ "$ran" -eq 0 ]]; then echo 'No supported application test manifest detected; checks are a no-op.'; fi
  assistant-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Run repository assistant review hook
        if: hashFiles('scripts/assistant/review.sh') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASSISTANT_PAT: ${{ secrets.ASSISTANT_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/assistant/review.sh
      - name: No review hook
        if: hashFiles('scripts/assistant/review.sh') == ''
        run: echo 'No repository-local assistant review hook; skipping.'
