name: Fix WhatsApp Clippy once

on:
  push:
    branches:
      - feature/whatsapp-channel-post

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Elide needless WhatsApp lifetime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/whatsapp-channel-post

      - name: Elide needless lifetime
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/prism-provider-meta/src/whatsapp.rs')
          source = path.read_text()
          old = "fn text<'a>(request: &'a ProviderPublishRequest) -> Result<&'a str, DeliveryError>"
          new = "fn text(request: &ProviderPublishRequest) -> Result<&str, DeliveryError>"
          if source.count(old) != 1:
              raise SystemExit('expected exactly one lifetime signature')
          path.write_text(source.replace(old, new))
          PY

      - name: Verify change scope
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "crates/prism-provider-meta/src/whatsapp.rs"

      - name: Commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/prism-provider-meta/src/whatsapp.rs
          git commit -m "Elide needless WhatsApp lifetime"
          git push
