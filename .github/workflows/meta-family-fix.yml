name: Meta family source fix

on:
  push:
    branches: [feature/meta-provider-family]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Remove stale import
        run: sed -i 's/{Client, StatusCode, Url, header::RETRY_AFTER}/{Client, Url, header::RETRY_AFTER}/' crates/prism-provider-meta/src/facebook.rs

      - name: Format workspace
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Commit canonical source
        shell: bash
        run: |
          set -Eeuo pipefail
          git add crates/prism-provider-meta
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Format and verify Meta provider sources"
          git push origin HEAD:${GITHUB_REF_NAME}
