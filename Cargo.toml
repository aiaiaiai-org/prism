[workspace]
members = [
  "crates/prism-core",
  "crates/prism-provider",
  "crates/prism-provider-meta",
  "crates/prism-provider-threads",
  "crates/prism-protocol",
  "crates/prism-runtime",
  "crates/prism-testkit",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/aiaiaiai-org/prism"
authors = ["aiaiaiai tech."]

[workspace.dependencies]
async-trait = "0.1"
language-tags = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev]
debug = 1
